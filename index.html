<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 영화 5편</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 네비게이션 바 -->
  <nav class="navbar">
    <div class="logo">내 영화 보드</div>
    <div class="menu">
      <a href="#">보드</a>
      <a href="#">소개</a>
      <a href="#">성적</a>
    </div>
  </nav>

  <!-- 메인 컨테이너 -->
  <main class="container">
    <!-- 히어로 배너 섹션 -->
    <section class="hero">
      <div class="hero-content">
        <h2>요즘 내가 고른 영화 다섯 편</h2>
        <p>포스터 위에 마우스를 올려 보세요.</p>
        <!-- 10주차 자바스크립트 결과 한 줄 출력용 -->
        <pre id="out" class="hero-out"></pre>
      </div>
    </section>

    <!-- 영화 카드 5개가 들어갈 그리드 영역 -->
    <div id="movie-grid" class="movie-grid"></div>
  </main>

  <footer>
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>

  <!-- 스크립트: data.js가 먼저 오고 그 다음 app.js -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
